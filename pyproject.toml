[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "property_deal_finder"
version = "0.0.1"
description = "End-to-end data pipeline and dashboard detecting undervalued real estate deals."
authors = [
  { name = "Dawid Wysokinski" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["property_deal_finder"]
include = ["pyproject.toml", "property_deal_finder/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["property_deal_finder"]
force-sort-within-sections = true

